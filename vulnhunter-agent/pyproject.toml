[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "c1-vulnhunter-agent"
dynamic = ["version"]
description = "Provider-neutral, multi-model VulnHunter scanner with legacy Claude workflow compatibility."
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "claude-agent-sdk",
    "httpx",
    "jsonschema>=4.18",
    "tenacity",
    "certifi",
]

[project.scripts]
vulnhunter = "vulnhunter.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pytest-asyncio", "syrupy", "respx", "hypothesis", "anyio"]

[project.urls]
homepage = "https://github.com/JJsilvera1/Multi-VulnHunter"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "vulnhunter*"]

[tool.setuptools.package-data]
vulnhunter = [
    "schemas/*.json",
    "rules/*.yml",
    "sandbox_image/Dockerfile",
    "sandbox_image/runner.py",
]

[tool.setuptools.dynamic]
version = { attr = "vulnhunter.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:claude_agent_sdk.*",
    "ignore::DeprecationWarning:hypothesis.*",
    "ignore::RuntimeWarning:runpy",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
branch = true
source = ["agent", "vulnhunter"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
